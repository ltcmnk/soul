<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste | SOul</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #2c3e50;
      color: #fff;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.5rem;
      align-items: center;
    }

    nav a {
      color: #ecf0f1;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: #1abc9c;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .login-btn {
      background: #1abc9c;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .login-btn:hover {
      background: #16a085;
    }

    main {
      padding: 3rem 2rem;
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      padding: 2.5rem;
      margin-bottom: 2rem;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #ecf0f1;
      border-radius: 3px;
      margin-bottom: 2rem;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 28.57%;
      background: #1abc9c;
      transition: width 0.3s ease;
    }

    .question {
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .question h2 {
      font-size: 1.5rem;
      color: #2c3e50;
      margin-bottom: 1rem;
    }

    .question p {
      color: #7f8c8d;
      font-size: 1rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .option-card {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }

    .option-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .option-card.selected {
      border-color: #1abc9c;
      background: rgba(26, 188, 156, 0.05);
    }

    .option-icon {
      font-size: 2.5rem;
      color: #1abc9c;
      margin-bottom: 1rem;
    }

    .option-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 0.5rem;
    }

    .option-description {
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 800px;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-secondary {
      background: none;
      border: 1px solid #bdc3c7;
      color: #7f8c8d;
    }

    .btn-secondary:hover {
      border-color: #1abc9c;
      color: #1abc9c;
    }

    .btn-primary {
      background: #1abc9c;
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #16a085;
      transform: translateY(-2px);
    }

    .btn-primary:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
      transform: none;
    }

    @media (max-width: 768px) {
      .container {
        padding: 1.5rem;
      }
      
      .options-grid {
        grid-template-columns: 1fr;
      }
      
      .question h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='index.html'">SOul</div>
    <nav>
      <ul>
        <li><a href="os.html">Sistemas Operacionais</a></li>
        <li><a href="favorites.html">Favoritos</a></li>
        <li><a href="test.html">Teste</a></li>
        <li><a href="about.html">Sobre Nós</a></li>
        <li class="user-area">
          <a href="login.html" class="login-btn">Entrar</a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="progress-bar">
        <div class="progress" id="progressBar" style="width: 28.57%"></div>
      </div>
      
      <div class="question">
        <h2>Você está disposto a pagar pelo seu sistema operacional?</h2>
        <p>Selecione a opção que melhor representa sua preferência</p>
      </div>
      
      <div class="options-grid" id="optionsGrid">
        <div class="option-card" data-value="no">
          <div class="option-icon">
            <i class="fas fa-times"></i>
          </div>
          <h3 class="option-title">Não</h3>
          <p class="option-description">Prefiro opções gratuitas e código aberto</p>
        </div>

        <div class="option-card" data-value="yes">
          <div class="option-icon">
            <i class="fas fa-check"></i>
          </div>
          <h3 class="option-title">Sim</h3>
          <p class="option-description">Quero recursos premium e suporte garantido</p>
        </div>
      </div>
    </div>
    
    <div class="navigation">
      <button class="btn btn-secondary" id="backBtn">Voltar</button>
      <button class="btn btn-primary" id="nextBtn" disabled>Próxima</button>
    </div>
  </main>

  <script src="shared.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Verifica se o usuário está logado
      if (!navigation.requireAuth()) return;

      // Elementos da página
      const optionsGrid = document.getElementById('optionsGrid');
      const nextBtn = document.getElementById('nextBtn');
      const backBtn = document.getElementById('backBtn');
      
      // Identifica a pergunta atual
      const currentPage = window.location.pathname.split('/').pop();
      const questionNumber = currentPage.replace('test', '').replace('.html', 'q');
      
      // Restaura resposta salva se existir
      const savedAnswer = testProgress.getAnswer(questionNumber);
      if (savedAnswer) {
          const selectedCard = document.querySelector(`.option-card[data-value="${savedAnswer}"]`);
          if (selectedCard) {
              selectedCard.classList.add('selected');
              nextBtn.disabled = false;
          }
      }

      // Configura o evento de clique nas opções
      optionsGrid.addEventListener('click', (e) => {
          const card = e.target.closest('.option-card');
          if (!card) return;

          // Remove seleção de outras opções
          document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
          
          // Seleciona a opção clicada
          card.classList.add('selected');
          nextBtn.disabled = false;

          // Salva a resposta
          const answer = card.dataset.value;
          testProgress.saveAnswer(questionNumber, answer);
      });

      // Configura o botão de próxima
      nextBtn.addEventListener('click', () => {
          const nextPage = getNextPage();
          testProgress.setCurrentQuestion(nextPage);
          window.location.href = nextPage;
      });

      // Configura o botão de voltar
      backBtn.addEventListener('click', (e) => {
          e.preventDefault();
          navigation.goBackToTest();
      });

      // Função auxiliar para determinar a próxima página
      function getNextPage() {
          const currentTestNumber = parseInt(questionNumber.replace('q', ''));
          return currentTestNumber === 6 ? 'testresult.html' : `test${currentTestNumber + 1}.html`;
      }
    });
  </script>
</body>
</html>
