<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar | SOul</title>
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('soul-theme')||'dark')</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <a href="index.html" class="auth-brand">SO<span>ul</span></a>

    <div class="auth-header">
      <h1>Bem-vindo de volta</h1>
      <p>Faça login na sua conta para continuar</p>
    </div>

    <form id="loginForm">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="text" id="loginEmail" placeholder="Usuário ou E-mail" required autocomplete="email">
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="loginPassword" placeholder="Senha" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:.25rem">
        Entrar <i class="fas fa-arrow-right"></i>
      </button>

      <div id="loginMessage" class="message"></div>
    </form>

    <p class="auth-link">Não tem uma conta? <a href="signup.html">Cadastre-se</a></p>
  </div>

  <footer style="text-align:center;padding:1.5rem;margin-top:auto;">
    <div style="display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;">
      <a href="terms.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Termos de Uso</a>
      <a href="privacy.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Política de Privacidade</a>
      <a href="about.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Sobre</a>
    </div>
    <p style="color:var(--t3);font-size:.78rem;margin-top:.6rem">© 2025 SOul — Projeto Universitário</p>
  </footer>

  <script src="shared.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      fetch('login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, senha: password })
      })
      .then(response => response.json())
      .then(data => {
        const messageEl = document.getElementById('loginMessage');
        messageEl.textContent = data.message || '';
        messageEl.style.color = data.success ? 'var(--success)' : 'var(--danger)';

        if (data.success) {
          auth.login(data);
          setTimeout(() => {
            window.location.href = data.redirect || 'index.html';
          }, 1000);
        }
      })
      .catch(() => {
        const messageEl = document.getElementById('loginMessage');
        messageEl.textContent = 'Erro ao conectar com o servidor';
        messageEl.style.color = 'var(--danger)';
      });
    });
  </script>
</body>
</html>
