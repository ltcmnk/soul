<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro | SOul</title>
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('soul-theme')||'dark')</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <a href="index.html" class="auth-brand">SO<span>ul</span></a>

    <div class="auth-header">
      <h1>Crie sua conta</h1>
      <p>Preencha os campos abaixo para se cadastrar</p>
    </div>

    <form id="signupForm">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="Nome de usuário" required autocomplete="username">
      </div>

      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="email" placeholder="E-mail" required autocomplete="email">
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Senha" required autocomplete="new-password">
      </div>

      <div class="password-strength">
        <span id="strengthText">Força da senha: </span>
        <span id="strengthMeter"></span>
      </div>

      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="confirmPassword" placeholder="Confirme sua senha" required autocomplete="new-password">
      </div>

      <div id="passwordMatch" class="password-match"></div>

      <button type="submit" id="submitButton" class="btn btn-primary" disabled style="width:100%;justify-content:center;margin-top:.25rem">
        Cadastrar <i class="fas fa-arrow-right"></i>
      </button>

      <div id="signupMessage" class="message"></div>
    </form>

    <p class="auth-link">Já tem uma conta? <a href="login.html">Faça login</a></p>

    <p class="terms">
      Ao se cadastrar, você concorda com nossos <a href="terms.html">Termos de Uso</a> e <a href="privacy.html">Política de Privacidade</a>.
    </p>
  </div>

  <footer style="text-align:center;padding:1.5rem;margin-top:auto;">
    <div style="display:flex;justify-content:center;gap:1.5rem;flex-wrap:wrap;font-size:.85rem;">
      <a href="terms.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Termos de Uso</a>
      <a href="privacy.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Política de Privacidade</a>
      <a href="about.html" style="color:var(--t3);text-decoration:none;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--t3)'">Sobre</a>
    </div>
    <p style="color:var(--t3);font-size:.78rem;margin-top:.6rem">© 2025 SOul — Projeto Universitário</p>
  </footer>

  <script src="shared.js"></script>
  <script>
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const passwordMatchEl = document.getElementById('passwordMatch');
    const submitButton = document.getElementById('submitButton');
    let isPasswordValid = false;
    let doPasswordsMatch = false;

    passwordInput.addEventListener('input', validatePassword);
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    function validatePassword() {
      const password = passwordInput.value;
      const strengthText = document.getElementById('strengthText');
      const strengthMeter = document.getElementById('strengthMeter');

      let strength = 0;
      let meterColor = '';
      let text = '';

      if (password.length >= 8) strength += 1;
      if (password.length >= 12) strength += 1;
      if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength += 1;
      if (/\d/.test(password)) strength += 1;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 1;

      switch(strength) {
        case 0:
        case 1:
          text = 'Fraca'; meterColor = 'var(--danger)'; isPasswordValid = false; break;
        case 2:
          text = 'Moderada'; meterColor = '#f39c12'; isPasswordValid = true; break;
        case 3:
          text = 'Boa'; meterColor = 'var(--primary)'; isPasswordValid = true; break;
        case 4:
        case 5:
          text = 'Forte'; meterColor = 'var(--success)'; isPasswordValid = true; break;
      }

      strengthText.textContent = `Força da senha: ${text}`;
      strengthMeter.textContent = '●'.repeat(strength);
      strengthMeter.style.color = meterColor;

      checkPasswordMatch();
      updateSubmitButton();
    }

    function checkPasswordMatch() {
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password && confirmPassword) {
        if (password === confirmPassword) {
          passwordMatchEl.textContent = 'As senhas coincidem!';
          passwordMatchEl.className = 'password-match valid';
          doPasswordsMatch = true;
        } else {
          passwordMatchEl.textContent = 'As senhas não coincidem!';
          passwordMatchEl.className = 'password-match invalid';
          doPasswordsMatch = false;
        }
      } else {
        passwordMatchEl.textContent = '';
        passwordMatchEl.className = 'password-match';
        doPasswordsMatch = false;
      }

      updateSubmitButton();
    }

    function updateSubmitButton() {
      submitButton.disabled = !(isPasswordValid && doPasswordsMatch);
    }

    document.getElementById('signupForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const messageEl = document.getElementById('signupMessage');

      if (password.length < 8) {
        messageEl.textContent = 'A senha deve ter pelo menos 8 caracteres';
        messageEl.style.color = 'var(--danger)';
        return;
      }

      if (password !== confirmPassword) {
        messageEl.textContent = 'As senhas não coincidem';
        messageEl.style.color = 'var(--danger)';
        return;
      }

      fetch('cadastro.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: username, email: email, senha: password })
      })
      .then(response => response.json())
      .then(data => {
        messageEl.textContent = data.message || '';
        messageEl.style.color = data.success ? 'var(--success)' : 'var(--danger)';

        if (data.success) {
          setTimeout(() => {
            window.location.href = data.redirect || 'index.html';
          }, 1500);
        }
      })
      .catch(() => {
        messageEl.textContent = 'Erro ao conectar com o servidor';
        messageEl.style.color = 'var(--danger)';
      });
    });
  </script>
</body>
</html>
